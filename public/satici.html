<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kafulluk Satıcı Paneli</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: solda sabit menü, sağda çalışma alanı. Koyu, sakin bir panel; bal rengi yalnızca eylem ve vurgu için kullanılır. */
:root{
  color-scheme:dark;
  --bg:#0A0F0B; --surface:#121A14; --surface-2:#18231B; --ink:#F3F5EC; --muted:#9BA89D;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.2);
  --honey:#F5B82E; --grad:linear-gradient(135deg,#FFD54F 0%,#F5A623 55%,#F08A1C 100%);
  --on-accent:#241800; --leaf:#7BD39A; --rose:#FF8A9B; --err:#FF8A80;
  --glass:color-mix(in srgb,#121A14 78%,transparent);
  --shadow:0 24px 60px rgba(0,0,0,.6);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 12% -5%,rgba(245,184,46,.13),transparent 60%),radial-gradient(800px 600px at 100% 20%,rgba(46,125,63,.2),transparent 60%),radial-gradient(700px 500px at 40% 110%,rgba(232,71,106,.07),transparent 60%)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px;border-radius:8px}
::selection{background:var(--honey);color:#241800}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}

.app{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:20px 48px;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
.side{position:sticky;top:max(20px,env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:18px;padding:18px 14px;border:1px solid var(--line);border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{height:46px;width:auto;flex:none;padding:4px 6px;border-radius:12px;background:#FBF6EA}
.brand b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:grid;gap:4px}
.nb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:12px;padding:11px 12px;font-weight:600;color:var(--muted);text-align:left;transition:background .2s,color .2s}
.nb svg{width:20px;height:20px;flex:none}
.nb:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.nb[aria-current="page"]{background:rgba(245,184,46,.14);color:var(--honey)}
.nb .n{margin-left:auto;min-width:22px;height:22px;border-radius:99px;background:var(--honey);color:#241800;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.nb .n.warn{background:var(--rose)}
.side .link{display:flex;align-items:center;gap:8px;margin-top:2px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-strong);color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.side .link:hover{color:var(--ink);border-color:var(--honey)}
.side .link svg{width:18px;height:18px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;align-items:center;gap:10px;padding:10px;overflow-x:auto;border-radius:18px}
  .brand{flex:none}.brand small{display:none}.brand div{display:none}.brand img{height:42px;width:auto}
  .nav{display:flex;gap:4px}
  .nb{width:auto;white-space:nowrap;padding:9px 12px}
  .side .link{display:none}
}

.main{min-width:0}
.view{animation:fadeUp .45s var(--ease) both}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.phead h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.phead p{color:var(--muted);margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;background:var(--grad);color:var(--on-accent);text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(245,184,46,.3);filter:brightness(1.05)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--honey);box-shadow:none}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--rose);border-color:rgba(255,138,155,.45)}
.btn.danger:hover{background:rgba(255,138,155,.1);box-shadow:none}
.btn.danger.arm{background:var(--rose);color:#2A0710}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.box{border:1px solid var(--line);border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.box>h3{font-size:19px;padding:18px 20px 0}
.box .bp{padding:16px 20px 20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;display:grid;gap:4px;animation:fadeUp .5s var(--ease) both}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
.kpi span{font-size:13px;font-weight:600;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi small{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--rose)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.g2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:1060px){.g2,.g2b{grid-template-columns:minmax(0,1fr)}}
.chartwrap{overflow-x:auto;padding:8px 8px 14px}
.chartwrap svg{display:block;min-width:520px;width:100%;height:auto}
.gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.ax{fill:var(--muted);font:500 11px var(--f-body)}
.vl{fill:var(--ink);font:700 11.5px var(--f-body)}
.dl{fill:var(--ink);font:600 12px var(--f-body)}
.bars{display:grid;gap:12px}
.bars div{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:14px}
.bars i{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bars i s{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s var(--ease)}
.bars b{text-align:right}

.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:4px 11px 4px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--muted);margin-left:6px;vertical-align:middle}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;padding:12px 16px;border-radius:14px;border:1px solid rgba(245,184,46,.35);background:rgba(245,184,46,.08);font-size:14px;margin-bottom:18px}

.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.search{position:relative;flex:1 1 240px;max-width:420px}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);padding:0 16px 0 42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.sel:focus{outline:none;border-color:var(--honey);box-shadow:0 0 0 4px rgba(245,184,46,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);border-radius:999px;height:38px;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,border-color .2s}
.chip small{color:var(--muted);margin-left:4px;font-weight:600}
.chip:hover{border-color:var(--honey)}
.chip[aria-pressed="true"]{background:var(--grad);color:var(--on-accent);border-color:transparent}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.sel{height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;min-width:0}

.tlist{overflow:hidden}
.thead,.trow{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:12px 20px}
.thead{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.trow{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;transition:background .2s}
.trow:last-child{border-bottom:0}
button.trow:hover,.trow.hov:hover{background:rgba(255,255,255,.04)}
.trow b{font-weight:700}.trow span.s{display:block;font-size:13px;color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);margin-bottom:6px}
.oc{--cols:1.1fr 1.5fr .8fr 1.1fr}
.pc{--cols:46px minmax(0,2fr) 1.3fr .9fr 1.2fr 70px 76px}
.cc{--cols:1.2fr .8fr 1fr 70px 76px}
@media (max-width:760px){
  .thead{display:none}
  .oc.trow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a c" "b d";row-gap:6px}
  .oc .c1{grid-area:a}.oc .c2{grid-area:b}.oc .c3{grid-area:c;text-align:right}.oc .c4{grid-area:d;justify-self:end}
  .pc.trow{grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"sw nm ed" "sw ct ct" "pr st tg";row-gap:8px}
  .pc .sw{grid-area:sw;align-self:start}.pc .nm{grid-area:nm}.pc .ct{grid-area:ct}.pc .pr{grid-area:pr}.pc .st{grid-area:st}.pc .tg{grid-area:tg;justify-self:end}.pc .ed{grid-area:ed}
  .cc.trow{grid-template-columns:minmax(0,1fr) auto auto}
}
.swatch{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);background:linear-gradient(135deg,var(--c1),var(--c2))}
.stk{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,255,255,.04)}
.stk button{width:34px;height:34px;border:0;background:none;border-radius:50%;font-size:17px}
.stk button:hover{background:rgba(255,255,255,.1)}
.stk span{min-width:34px;text-align:center;font-weight:700}
.stk.low{border-color:var(--rose)}.stk.low span{color:var(--rose)}
.sw{position:relative;display:inline-block;width:44px;height:26px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);transition:background .25s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked+i{background:var(--leaf)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--honey);outline-offset:2px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--honey)}
.iconbtn svg{width:17px;height:17px}

.rl{display:grid;gap:2px}
.rl .trow{padding:11px 4px;--cols:minmax(0,1fr) auto}
.skel{height:84px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.pricehint{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(245,184,46,.07);border:1px solid rgba(245,184,46,.25)}
.pricehint b{color:var(--ink)}
.qlist{display:grid;gap:14px}
.qcard{padding:18px 20px;display:grid;gap:12px}
.qtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qst{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}.qst.wait{background:rgba(245,184,46,.15);color:var(--honey)}.qst.ok{background:rgba(123,211,154,.12);color:var(--leaf)}
.qchat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:10px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.qb{max-width:80%;padding:9px 12px;border-radius:14px;display:grid;gap:2px}
.qb b{font-size:12px;color:var(--muted)}.qb p{margin:0;white-space:pre-wrap;font-size:14.5px;line-height:1.5}.qb small{font-size:11.5px;color:var(--muted)}
.qb.them{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-left-radius:5px}
.qb.me{align-self:flex-end;background:rgba(245,184,46,.13);border:1px solid rgba(245,184,46,.3);border-bottom-right-radius:5px}
.qreply{display:flex;gap:8px;align-items:flex-end}
.qreply textarea{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);padding:10px 12px;min-height:44px;resize:vertical;font:inherit;color:var(--ink)}
.qreply textarea:focus{outline:none;border-color:var(--honey)}
.qcard.open{border-color:rgba(245,184,46,.45)}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qtop b{display:block}.qtop .s{color:var(--muted);font-size:13.5px}.qtop a{color:inherit}
.qprod{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.qq{margin:0;font-size:15.5px;line-height:1.5;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border-left:3px solid var(--honey)}
.qacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qacts .qpub{margin:0 0 0 auto;padding:8px 12px}
.qmeta{margin:0;font-size:13px}
.me{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.mewho b{display:block;font-size:14.5px}.mewho small{color:var(--muted);font-size:12.5px}
.meacts{display:flex;flex-wrap:wrap;gap:6px}.meacts button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.meacts button:hover{color:var(--ink);border-color:var(--line-strong)}
.thead.uc,.trow.uc{grid-template-columns:minmax(0,1.6fr) 150px 130px 70px 200px;align-items:center;column-gap:14px}
.uacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.sel.sm{min-height:38px;padding:6px 10px}
@media (max-width:720px){.thead.uc{display:none}.trow.uc{grid-template-columns:1fr 1fr;row-gap:10px}.trow.uc .uacts{justify-content:flex-start}}
.gate{max-width:560px;margin:12vh auto;text-align:center;padding:36px 28px}
.gate h1{font-size:30px;margin-bottom:10px}.gate p{color:var(--muted)}

/* formlar */
.fld label,.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);padding:11px 13px;min-height:46px}
.fld select{background:var(--surface)}
.fld textarea{min-height:76px;resize:vertical}
.fld input[type="color"]{padding:4px;min-height:46px;cursor:pointer}
.fld .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.fld.bad input,.fld.bad select{border-color:var(--err)}
.fld .e{color:var(--err);font-size:12.5px;margin-top:3px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fg .full{grid-column:1/-1}
@media (max-width:560px){.fg,.fg.c3{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--honey);margin-bottom:10px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:rgba(255,255,255,.04);margin-bottom:16px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--on-accent)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line-strong);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14.5px}
.opt input{margin-top:3px;accent-color:var(--honey);width:17px;height:17px;flex:none}
.opt:has(input:checked){border-color:var(--honey);background:rgba(245,184,46,.08)}
.lines{display:grid;gap:8px;margin:10px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.line .stk button{width:30px;height:30px}
.tots{display:grid;gap:6px;font-size:15px;margin-top:8px}
.tots div{display:flex;justify-content:space-between;gap:12px}
.tots .tt{font-family:var(--f-display);font-size:22px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* örtü, çekmece, pencere */
.veil{position:fixed;inset:0;z-index:70;background:rgba(3,6,4,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:80;background:#0D140F;border-left:1px solid var(--line-strong);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);
  transform:translateX(105%);visibility:hidden;transition:transform .4s var(--ease),visibility .4s}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}

function parseSummary(t,products){

async function saveProduct(){
  var ok=true;function bad(id,m){var e=$("#e-"+id);if(e)e.textContent=m;var f=$("#"+id);if(f&&f.parentNode)f.parentNode.classList.add("bad");ok=false;}
  ["pf-name","pf-net","pf-stock"].forEach(function(i){var e=$("#e-"+i);if(e)e.textContent="";$("#"+i).parentNode.classList.remove("bad");});
  var name=gv("pf-name"),net=num(gv("pf-net")),vat=+$("#pf-vat").value,stock=gv("pf-stock")===""?NaN:Math.floor(num(gv("pf-stock")));
  if(name.length<2)bad("pf-name","Ürün adını yazın.");
  if(!(net>0))bad("pf-net","KDV hariç fiyatı sıfırdan büyük girin.");
  if(isNaN(stock)||stock<0)bad("pf-stock","Stok adedini girin.");
  if(!ok)return;
  var oldNet=num(gv("pf-oldnet"));
  var base=M.id?Object.assign({},S.p[M.id]):{};delete base.id;
  var doc=Object.assign(base,{name:name,cat:$("#pf-cat").value,w:gv("pf-w"),net:net,vat:vat,oldNet:oldNet>net?oldNet:0,stock:stock,origin:gv("pf-origin"),desc:gv("pf-desc"),store:gv("pf-store"),img:gv("pf-img"),type:$("#pf-type").value,c1:$("#pf-c1").value,c2:$("#pf-c2").value,active:$("#pf-active").checked});
  delete doc.price;delete doc.old;
  if(!M.id)doc.sort=Date.now();
  var id=M.id||(name.toLowerCase().replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"urun")+"-"+Math.random().toString(36).slice(2,6);
  if(await w(function(){return db.doc("products/"+id).set(doc);},M.id?"Ürün güncellendi":"Ürün eklendi"))closeModal();
}

/* ===== KDV yardımcıları ===== */
var VATS=[1,10,20,0];
function r2(n){return Math.round(n*100)/100;}
function grossOf(net,v){return r2(net*(1+v/100));}
function netOf(g,v){return r2(g/(1+v/100));}
/* KDV hariç ↔ KDV dahil alanlarını birbirine bağla; hangisi yazılırsa diğeri hesaplanır */
function syncPrice(src){
  var n=$("#pf-net"),g=$("#pf-gross"),v=$("#pf-vat"),h=$("#priceHint");if(!n||!g||!v)return;
  var rate=+v.value;
  if(src==="gross"){var gv2=num(g.value);n.value=gv2>0?String(netOf(gv2,rate)).replace(".",","):"";}
  else{var nv=num(n.value);g.value=nv>0?String(grossOf(nv,rate)).replace(".",","):"";}
  var net=num(n.value),gross=grossOf(net,rate),on=num(($("#pf-oldnet")||{}).value);
  h.innerHTML=net>0?'Müşteri <b>'+TL(gross)+'</b> görür (KDV hariç '+TL(net)+' + %'+rate+' KDV '+TL(r2(gross-net))+')'+(on>net?' · indirim öncesi <s>'+TL(grossOf(on,rate))+'</s>':''):'KDV hariç fiyatı girin; KDV dahil fiyat otomatik hesaplanır. İsterseniz KDV dahil fiyatı yazın, KDV hariç fiyat hesaplanır.';
}

function calcM(){
  var sub=M.lines.reduce(function(s,l){return s+l.price*l.qty;},0),disc=Math.min(M.disc||0,sub);
  var ship=M.ship!=null?M.ship:(M.dlv==="fast"?+setting("fast"):((sub-disc)>=+setting("freeAt")?0:+setting("ship")));
  if(!M.lines.length)ship=M.ship!=null?M.ship:0;

/* ===== sunucu veri katmanı (/api/admin) =====
   Panelin geri kalanı doc()/collection() arayüzünü kullanır; burada REST çağrılarına çevrilir. */
function makeApiDb(){
  var data={products:{},orders:{},coupons:{},settings:{},questions:{}},subs=[],pending=false,lastNew=null,lastQ=null,timer=null;
  async function call(method,path,body){
    var r;
    try{r=await fetch(path,{method:method,credentials:"same-origin",headers:body!==undefined?{"content-type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined});}
    catch(e){throw {code:"api",message:"Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin."};}
    var d=null;try{d=await r.json();}catch(e){}
    if(r.status===401){authLost();throw {code:"auth",message:"Oturum süresi doldu. Tekrar giriş yapın."};}
    if(!r.ok||!d||d.ok===false)throw {code:"api",message:(d&&d.error)||"İşlem yapılamadı ("+r.status+")."};
    return d;
  }
  function idx(arr,k){var o={};(arr||[]).forEach(function(x){o[x[k]]=x;});return o;}
  async function refresh(){
    var d=await call("GET","/api/admin/data");
    data.products=idx(d.products,"id");data.orders=idx(d.orders,"id");data.coupons=idx(d.coupons,"code");data.settings={store:d.settings||{}};data.questions=idx(d.questions,"id");
    var qopen=(d.questions||[]).filter(function(q){return q.lastFrom!=="satici";});
    // yeni soru ya da müşteriden yeni mesaj geldiyse bildir
    if(lastQ){var nq=qopen.filter(function(q){return !lastQ[q.id]||lastQ[q.id]<q.lastAt;});if(nq.length)toast(nq.length===1?(nq[0].messages&&nq[0].messages.length?"Yeni mesaj: ":"Yeni soru: ")+nq[0].name+(nq[0].productName?" · "+nq[0].productName:""):nq.length+" yeni soru/mesaj geldi");}
    lastQ={};qopen.forEach(function(q){lastQ[q.id]=q.lastAt;});
    var fresh=d.orders.filter(function(o){return o.status==="yeni";});
    if(lastNew){var nw=fresh.filter(function(o){return !lastNew[o.id]&&o.source==="web";});if(nw.length)toast(nw.length===1?"Yeni sipariş geldi: "+nw[0].no:nw.length+" yeni sipariş geldi");}
    lastNew={};fresh.forEach(function(o){lastNew[o.id]=1;});
    var badge=fresh.length+qopen.length;document.title=(badge?"("+badge+") ":"")+"Kafulluk Satıcı Paneli";
    notify();return d;
  }
  function notify(){if(pending)return;pending=true;Promise.resolve().then(function(){pending=false;subs.slice().forEach(function(s){s();});});}
  function split(path){var i=path.indexOf("/");return [path.slice(0,i),path.slice(i+1)];}
  function snap(col,id){var v=data[col]&&data[col][id];return {id:id,exists:!!v,data:function(){return v?JSON.parse(JSON.stringify(v)):undefined;}};}
  var U={products:"/api/admin/products/",coupons:"/api/admin/coupons/",orders:"/api/admin/orders/",questions:"/api/admin/questions/"};
  function strip(d){var o=Object.assign({},d);delete o.id;return o;}
  async function after(p){var r=await p;await refresh();return r;}
  return {
    refresh:refresh,
    start:function(){
      if(timer)return;
      // yeni siparişler için 20 sn'de bir kontrol; sekmeye dönünce hemen tazele
      timer=setInterval(function(){if(!document.hidden)refresh().catch(function(){});},20000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh().catch(function(){});});
    },
    doc:function(path){var s=split(path),col=s[0],id=s[1],enc=encodeURIComponent(id);return {
      get:function(){return Promise.resolve(snap(col,id));},
      set:function(d){return after(col==="settings"?call("PUT","/api/admin/settings",d):call("PUT",U[col]+enc,strip(d)));},
      update:function(d){return after(call("PATCH",U[col]+enc,d));},
      delete:function(){return after(call("DELETE",U[col]+enc));},
      onSnapshot:function(next){var f=function(){next(snap(col,id));};subs.push(f);return function(){subs=subs.filter(function(x){return x!==f;});};}
    };},
    collection:function(col){return {
      onSnapshot:function(next){var f=function(){next({docs:Object.keys(data[col]||{}).map(function(k){return snap(col,k);})});};subs.push(f);return function(){subs=subs.filter(function(x){return x!==f;});};}
    };},
    me:function(){return call("GET","/api/admin/me").then(function(d){return d.user;});},
    users:function(){return call("GET","/api/admin/users").then(function(d){return d.users;});},
    userCreate:function(u){return call("POST","/api/admin/users",u);},
    userPatch:function(id,p){return call("PATCH","/api/admin/users/"+id,p);},
    userDelete:function(id){return call("DELETE","/api/admin/users/"+id);},
    myPassword:function(cur,next){return call("POST","/api/admin/password",{current:cur,next:next});},
    qReply:function(id,body){return after(call("POST","/api/admin/questions/"+id,{body:body}));},
    stock:function(id,delta){return after(call("POST","/api/admin/stock/"+encodeURIComponent(id),{delta:delta}));},
    exportAll:function(){return JSON.stringify({app:"kafulluk-satici",version:2,exportedAt:new Date().toISOString(),data:data},null,2);},
    importAll:function(o){var d=o&&o.data;if(!d||!d.products||!d.orders)return Promise.reject({code:"api",message:"Bu dosya geçerli bir yedek değil."});return after(call("POST","/api/admin/import",{data:d}));},
    reload:function(){return refresh();}
  };
}

  b.disabled=true;
  try{
    var r=await fetch("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:un.value.trim(),password:pw.value})});
    var d=null;try{d=await r.json();}catch(x){}
    if(!r.ok||!d||!d.ok){e.textContent=(d&&d.error)||"Giriş yapılamadı.";b.disabled=false;pw.select();return;}
  }catch(x){e.textContent="Sunucuya ulaşılamadı.";b.disabled=false;return;}
  boot();
}
async function boot(){
  S.gate=null;
  try{S.me=await db.me();S.users=null;renderNav();renderMe();await db.refresh();db.start();}
  catch(e){if(e&&e.code==="auth")return;S.gate={t:"Panel açılamadı",m:(e&&e.message)||"Sunucuya ulaşılamadı.",retry:true};render();}
}

  var names=[["Ayşe Yılmaz","0532 111 22 33","İstanbul","Kadıköy","Caferağa Mah. Moda Cad. No:12 D:4"],["Mehmet Kaya","0541 222 33 44","Ankara","Çankaya","Kavaklıdere Mah. Tunalı Hilmi Cad. No:30 D:2"],["Zeynep Demir","0505 333 44 55","İzmir","Karşıyaka","Bostanlı Mah. Cemal Gürsel Cad. No:8 D:1"],["Can Arslan","0555 444 55 66","Bursa","Nilüfer","Özlüce Mah. Ihlamur Sok. No:5 D:6"]];
  var sts=["yeni","hazirlaniyor","kargoda","teslim"],now=Date.now(),DAY=86400000;
  var writes=names.map(function(n,i){
    var items=[ps[i%ps.length],ps[(i+3)%ps.length]].map(function(p,k){return {pid:p.id,name:p.name,w:p.w,price:p.price,qty:1+((i+k)%2)};});

  });
  w(function(){return Promise.all(writes);},"Örnek siparişler eklendi");
}

/* ===== başlangıç ===== */
(async function init(){
  var h=location.hash.replace("#","");if(VIEWS.some(function(v){return v[0]===h;}))S.view=h;
  renderNav();
  db=makeApiDb();
  function coll(name,key,flag){db.collection(name).onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){if(d.exists)o[d.id]=Object.assign({id:d.id},d.data());});S[key]=o;S.ready[flag]=true;render();});}
  coll("products","p","p");coll("orders","o","o");coll("coupons","c","c");coll("questions","q","q");
  db.doc("settings/store").onSnapshot(function(s){S.set=Object.assign({},DEF,s.exists?s.data():{});S.ready.s=true;render();});
  boot();
})();
})();
